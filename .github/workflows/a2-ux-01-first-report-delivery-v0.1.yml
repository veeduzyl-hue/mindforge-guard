name: A2 UX 01 first report delivery verification

on:
  push:
    branches:
      - feat/a2-ux-01-first-report-delivery-v0.1
  pull_request:
    paths:
      - 'downloads/mindforge-guard-hr-self-service-sample-pack-v0.1.zip'
      - 'downloads/mindforge-guard-hr-self-service-sample-pack-v0.1.zip.*'
      - 'scripts/build_a2_sample_pack.py'
      - 'scripts/verify_a2_sample_pack.py'
      - 'scripts/verify_a2_first_report_delivery.py'
      - 'packages/guard/src/**'
      - '.github/workflows/a2-ux-01-first-report-delivery-v0.1.yml'

permissions:
  contents: read

jobs:
  sample-and-cli-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run verify:v7.0.1
      - run: python scripts/build_a2_sample_pack.py
      - name: Verify reproducible committed downloads (Linux)
        run: git diff --exit-code -- downloads/
      - run: python scripts/verify_a2_sample_pack.py
      - run: python scripts/verify_a2_first_report_delivery.py
      - name: Verify next-release npm tarball contents (Linux)
        shell: bash
        run: |
          npm pack --workspace @veeduzyl/mindforge-guard --dry-run --json > "$RUNNER_TEMP/a2-npm-pack.json"
          node -e 'const fs=require("node:fs");const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8"))[0];const s=new Set(p.files.map(f=>f.path));for(const f of ["bin/guard.mjs","src/cli/report_render_html.mjs","src/presentation/role_based_html_report.mjs","README.md"])if(!s.has(f))throw Error("PACKAGE_MISSING:"+f);console.log("PASS: next-release tarball contains CLI, renderer and README")' "$RUNNER_TEMP/a2-npm-pack.json"
      - run: node scripts/verify_v7_role_based_report_render.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a2-ux-01-linux-evidence
          path: downloads/
          retention-days: 14

  sample-and-cli-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm.cmd ci --ignore-scripts --no-audit --no-fund
        shell: powershell
      - run: npm.cmd run verify:v7.0.1
        shell: powershell
      - run: python scripts/build_a2_sample_pack.py
        shell: powershell
      - name: Verify reproducible committed downloads (Windows)
        shell: powershell
        run: |
          git diff --exit-code -- downloads/
          if ($LASTEXITCODE -ne 0) { throw 'A2_COMMITTED_DOWNLOAD_BYTES_DIFFER' }
      - run: python scripts/verify_a2_sample_pack.py
        shell: powershell
      - run: python scripts/verify_a2_first_report_delivery.py
        shell: powershell
      - name: Verify next-release npm tarball contents (Windows)
        shell: powershell
        run: |
          npm.cmd pack --workspace @veeduzyl/mindforge-guard --dry-run --json | Out-File -Encoding utf8 "$env:RUNNER_TEMP\a2-npm-pack.json"
          if ($LASTEXITCODE -ne 0) { throw 'NPM_PACK_DRY_RUN_FAILED' }
          $p = Get-Content "$env:RUNNER_TEMP\a2-npm-pack.json" -Raw | ConvertFrom-Json
          $paths = @($p[0].files | ForEach-Object { $_.path })
          foreach ($f in @('bin/guard.mjs','src/cli/report_render_html.mjs','src/presentation/role_based_html_report.mjs','README.md')) { if ($paths -notcontains $f) { throw ('PACKAGE_MISSING: ' + $f) } }
          Write-Host 'PASS: next-release tarball contains CLI, renderer and README'
      - run: node scripts/verify_v7_role_based_report_render.mjs
        shell: powershell
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a2-ux-01-windows-evidence
          path: downloads/
          retention-days: 14
