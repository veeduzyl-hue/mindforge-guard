          set -euo pipefail
          echo "PINNED_RESEARCH_PARENT=a1e6c84a9628430c3a6a8d242ab96f62de79d1f9"
          git merge-base --is-ancestor "a1e6c84a9628430c3a6a8d242ab96f62de79d1f9" HEAD
          test "$(git diff --name-only "a1e6c84a9628430c3a6a8d242ab96f62de79d1f9" HEAD | grep -Ev '^(experiments/i1-sec-02-native-noreplace-poc/|\.github/workflows/guard-i1-sec-02-native-poc.yml$)' | wc -l | tr -d ' ')" = "0"
          OUT="$RUNNER_TEMP/i1-sec-02-${PLATFORM}"
          mkdir -p "$OUT"
          python3 experiments/i1-sec-02-native-noreplace-poc/run_poc.py --output "$OUT/native-receipt.json" | tee "$OUT/native-run.log"
          python3 -m json.tool "$OUT/native-receipt.json" >/dev/null
          python3 -c 'import json,sys; j=json.load(open(sys.argv[1])); assert j["goals"]["G1_atomic_no_clobber"]=="PASS_BOUNDED"; assert j["counts"].get("FAIL",0)==0; print("NATIVE_G1_BOUNDED_PASS",j["goals"])' "$OUT/native-receipt.json"
          shasum -a 256 experiments/i1-sec-02-native-noreplace-poc/*.py experiments/i1-sec-02-native-noreplace-poc/README.md > "$OUT/source-sha256.txt"
          echo "$GITHUB_SHA" > "$OUT/experiment-branch-sha.txt"
          echo "$(uname -s) $(uname -m)" > "$OUT/host-platform.txt"
      - name: Retain raw syscall and boundary receipts
