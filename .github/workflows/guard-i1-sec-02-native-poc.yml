  windows-ntfs:
    name: windows-ntfs
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 30
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe native Windows API on disposable test directory
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git merge-base --is-ancestor 'a1e6c84a9628430c3a6a8d242ab96f62de79d1f9' HEAD
          if ($LASTEXITCODE -ne 0) { throw 'BASELINE_IDENTITY_MISMATCH' }
          $changes = @(git diff --name-only 'a1e6c84a9628430c3a6a8d242ab96f62de79d1f9' HEAD)
          foreach ($p in $changes) {
            if (-not ($p.StartsWith('experiments/i1-sec-02-native-noreplace-poc/') -or $p -eq '.github/workflows/guard-i1-sec-02-native-poc.yml')) {
              throw ('PRODUCT_SOURCE_CHANGE_FORBIDDEN:' + $p)
            }
          }
          $out = Join-Path $env:RUNNER_TEMP 'i1-sec-02-windows-ntfs'
          New-Item -ItemType Directory -Force $out | Out-Null
          python.exe experiments/i1-sec-02-native-noreplace-poc/run_poc.py --output (Join-Path $out 'native-receipt.json') | Tee-Object -FilePath (Join-Path $out 'native-run.log')
          if ($LASTEXITCODE -ne 0) { throw 'NATIVE_POC_TEST_FAILED' }
          python.exe -c "import json,sys; j=json.load(open(sys.argv[1])); assert j['goals']['G1_atomic_no_clobber']=='PASS_BOUNDED'; assert j['counts'].get('FAIL',0)==0; print('NATIVE_G1_BOUNDED_PASS',j['goals'])" (Join-Path $out 'native-receipt.json')
          if ($LASTEXITCODE -ne 0) { throw 'NATIVE_G1_NOT_ESTABLISHED' }
          $hashes = @()
          foreach ($p in @('experiments/i1-sec-02-native-noreplace-poc/native_bridge.py','experiments/i1-sec-02-native-noreplace-poc/run_poc.py','experiments/i1-sec-02-native-noreplace-poc/README.md')) {
            $hashes += ((Get-FileHash -Algorithm SHA256 $p).Hash.ToLowerInvariant() + '  ' + $p)
          }
          $hashes | Set-Content -Encoding ascii (Join-Path $out 'source-sha256.txt')
          $env:GITHUB_SHA | Set-Content -Encoding ascii (Join-Path $out 'experiment-branch-sha.txt')
          [System.Runtime.InteropServices.RuntimeInformation]::OSDescription | Set-Content -Encoding ascii (Join-Path $out 'host-platform.txt')
      - name: Retain raw syscall and boundary receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i1-sec-02-windows-ntfs
          path: ${{ runner.temp }}/i1-sec-02-windows-ntfs/
          retention-days: 30
          if-no-files-found: warn

