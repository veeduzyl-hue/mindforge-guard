name: ARCH v0.2.x M3 Review and Confirm synthetic
on:
  push:
    branches:
      - experiment/arch-v02x-m3-review-confirm-synthetic-20261119
    paths:
      - scripts/arch_v02x_m3_review_confirm_synthetic.mjs
      - scripts/verify_arch_v02x_m3_review_confirm_synthetic.mjs
      - docs/engineering/ARCH_V02X_M3_REVIEW_CONFIRM_SYNTHETIC_v0.1.md
      - .github/workflows/arch-v02x-m3-review-confirm-synthetic-20261119.yml
  pull_request:
    branches:
      - experiment/arch-v02x-m3-discover-draft-synthetic-20261119
permissions:
  contents: read
jobs:
  linux-m3-review-confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 45
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Pinned PR 375 and four path allowlist
        shell: bash
        run: |
          set -euo pipefail
          parent=8a9af158eb9966123df84d22a2ff5093faa47ecb
          git merge-base --is-ancestor "$parent" HEAD
          expected="$(printf '%s\n' \
            '.github/workflows/arch-v02x-m3-review-confirm-synthetic-20261119.yml' \
            'docs/engineering/ARCH_V02X_M3_REVIEW_CONFIRM_SYNTHETIC_v0.1.md' \
            'scripts/arch_v02x_m3_review_confirm_synthetic.mjs' \
            'scripts/verify_arch_v02x_m3_review_confirm_synthetic.mjs')"
          actual="$(git diff --name-only "$parent" HEAD)"
          test "$actual" = "$expected"
          git diff --check "$parent" HEAD
          node --check scripts/arch_v02x_m3_review_confirm_synthetic.mjs
          node --check scripts/verify_arch_v02x_m3_review_confirm_synthetic.mjs
          echo "M3RC_FIXED_TESTED_HEAD=$(git rev-parse HEAD)"
      - name: v7.0.1 and M3 I, D, RC synthetic-only suites
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run verify:v7.0.1
          before="$(git status --porcelain=v1 --untracked-files=normal)"
          node scripts/verify_arch_v02x_m3_source_inventory_synthetic.mjs
          node scripts/verify_arch_v02x_m3_discover_draft_synthetic.mjs
          node scripts/verify_arch_v02x_m3_review_confirm_synthetic.mjs
          after="$(git status --porcelain=v1 --untracked-files=normal)"
          if [[ "$before" != "$after" ]]; then
            echo 'M3_REVIEW_CONFIRMED_SOURCE_WORKTREE_MUTATION'
            printf 'before=%q after=%q\n' "$before" "$after"
            exit 88
          fi
          if [[ -n "$before" ]]; then
            bin='packages/guard/bin/guard.mjs'
            if [[ "$before" != " M $bin" ]] ||
               [[ "$(git ls-files --stage -- "$bin" | awk '{print $1}')" != '100644' ]] ||
               [[ "$(git hash-object "$bin")" != "$(git rev-parse "HEAD:$bin")" ]] ||
               [[ ! -x "$bin" ]]; then
              echo 'UNATTRIBUTED_BASELINE_WORKTREE_MUTATION'
              exit 89
            fi
            echo 'NPM_CI_EXECUTABLE_BIT_ONLY=UNCHANGED_CONTENT'
          fi
          echo 'M3_REVIEW_CONFIRM=SYNTHETIC_FIXTURE_ONLY'
          echo 'REAL_HUMAN_NOT_WITNESSED; M4_62=NOT_RUN; M5_HUMAN=NOT_TESTED'
          echo 'SIGNING=DEFERRED; NO_MAIN_MERGE; NO_RELEASE'
  windows-x64-m3-review-confirm:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 45
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          architecture: x64
      - name: Pinned PR 375 and strict four-path diff
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parent='8a9af158eb9966123df84d22a2ff5093faa47ecb'
          git merge-base --is-ancestor $parent HEAD
          if($LASTEXITCODE -ne 0){throw 'UNEXPECTED_PARENT'}
          $allowed=@(
            '.github/workflows/arch-v02x-m3-review-confirm-synthetic-20261119.yml',
            'docs/engineering/ARCH_V02X_M3_REVIEW_CONFIRM_SYNTHETIC_v0.1.md',
            'scripts/arch_v02x_m3_review_confirm_synthetic.mjs',
            'scripts/verify_arch_v02x_m3_review_confirm_synthetic.mjs'
          )
          $changed=@(git diff --name-only $parent HEAD)
          if($changed.Count -ne 4){throw 'UNEXPECTED_CHANGED_FILE_COUNT'}
          foreach($p in $changed){if($p -notin $allowed){throw ('UNAUTHORIZED_PATH:'+ $p)}}
          git diff --check $parent HEAD
          if($LASTEXITCODE -ne 0){throw 'GIT_DIFF_CHECK_FAILED'}
          node --check scripts/arch_v02x_m3_review_confirm_synthetic.mjs
          if($LASTEXITCODE -ne 0){throw 'REVIEW_CONFIRM_SYNTAX_FAILED'}
          node --check scripts/verify_arch_v02x_m3_review_confirm_synthetic.mjs
          if($LASTEXITCODE -ne 0){throw 'REVIEW_TEST_SYNTAX_FAILED'}
          Write-Output ('M3RC_FIXED_TESTED_HEAD='+(git rev-parse HEAD).Trim())
      - name: v7.0.1 and M3 I, D, RC synthetic-only suites
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npm.cmd ci --ignore-scripts --no-audit --no-fund
          if($LASTEXITCODE -ne 0){throw 'NPM_CI_FAILED'}
          npm.cmd run verify:v7.0.1
          if($LASTEXITCODE -ne 0){throw 'V701_COMPATIBILITY_FAILED'}
          $before=@(git status --porcelain=v1 --untracked-files=normal)
          node scripts/verify_arch_v02x_m3_source_inventory_synthetic.mjs
          if($LASTEXITCODE -ne 0){throw 'M3_INVENTORY_REGRESSION'}
          node scripts/verify_arch_v02x_m3_discover_draft_synthetic.mjs
          if($LASTEXITCODE -ne 0){throw 'M3_DISCOVER_REGRESSION'}
          node scripts/verify_arch_v02x_m3_review_confirm_synthetic.mjs
          if($LASTEXITCODE -ne 0){throw 'M3_REVIEW_CONFIRM_SYNTHETIC_FAILED'}
          $after=@(git status --porcelain=v1 --untracked-files=normal)
          if(($before -join [char]10) -ne ($after -join [char]10)){
            throw 'M3_REVIEW_CONFIRM_MUTATED_WORKTREE'
          }
          if(@($after|Where-Object {$_ -ne ''}).Count -gt 0){throw 'WINDOWS_WORKTREE_NOT_CLEAN'}
          Write-Output 'M3_REVIEW_CONFIRM=SYNTHETIC_FIXTURE_ONLY'
          Write-Output 'REAL_HUMAN_NOT_WITNESSED; M4_62=NOT_RUN; M5_HUMAN=NOT_TESTED'
          Write-Output 'SIGNING=DEFERRED; NO_MAIN_MERGE; NO_RELEASE'
