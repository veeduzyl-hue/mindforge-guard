          python3 -m zipfile -e downloads/mindforge-guard-hr-self-service-sample-pack-v0.1.zip "$RC_DIR/sample"
          GITHUB_SHA="4aa26fbdd418be669eb5c9cfeb1094b21ac554fb" GUARD_RC_OUTPUT_DIR="$RC_DIR" GUARD_RC_INSTALL_DIR="$PREFIX" GUARD_RC_TGZ="$TGZ" node scripts/verify_v7_1_rc_install.mjs
          echo "4aa26fbdd418be669eb5c9cfeb1094b21ac554fb" > "$RC_DIR/merge-candidate-sha.txt"
          echo "0d3b1d9d1a1677f4619bef370691c0c77ecb4c61" > "$RC_DIR/parent-main-sha.txt"
          echo "af0ca5427c90bb07d274d10c6df737ca5f89c782" > "$RC_DIR/parent-pr351-sha.txt"
          echo "$(uname -s) $(uname -m)" > "$RC_DIR/host-platform.txt"
