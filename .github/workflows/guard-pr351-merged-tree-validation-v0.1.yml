  integration-macos-intel:
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4aa26fbdd418be669eb5c9cfeb1094b21ac554fb
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require x64 then run merged-tree integration
        shell: bash
        run: |
          test "$(uname -m)" = "x86_64"
          test "$(node -p 'process.arch')" = "x64"
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "4aa26fbdd418be669eb5c9cfeb1094b21ac554fb"
          test "$(git rev-parse HEAD^1)" = "0d3b1d9d1a1677f4619bef370691c0c77ecb4c61"
          test "$(git rev-parse HEAD^2)" = "af0ca5427c90bb07d274d10c6df737ca5f89c782"
          test "$(git rev-parse HEAD:experiments)" = "1b77eebbd74af73fcc6a291ceaf2e6be99724702"
          npm ci --ignore-scripts --no-audit --no-fund
          npm run verify
          npm run verify:v7.0.1
          node scripts/verify_commercial_edition_boundary.mjs
          node scripts/verify_v7_role_based_report_render.mjs
          node scripts/verify_v7_1_rc_consistency.mjs
          python3 scripts/build_a2_sample_pack.py
          python3 scripts/verify_a2_sample_pack.py
          git diff --exit-code -- downloads/ package-lock.json packages/guard/package.json
          test "$(shasum -a 256 downloads/mindforge-guard-hr-self-service-sample-pack-v0.1.zip | cut -d' ' -f1)" = "1c0c7d4c26f564294c0024a0412ebf2f03288484002e8b61716526153eafb6bf"
          RC_DIR="$RUNNER_TEMP/guard-merge-mac-intel"
          PREFIX="$RUNNER_TEMP/guard-install-mac-intel"
          mkdir -p "$RC_DIR/sample" "$PREFIX"
          npm pack --workspace @veeduzyl/mindforge-guard --pack-destination "$RC_DIR" --json > "$RC_DIR/npm-pack.json"
          TGZ="$RC_DIR/veeduzyl-mindforge-guard-7.1.0-rc.0.tgz"
          npm install --prefix "$PREFIX" --ignore-scripts --no-audit --no-fund "$TGZ"
          cp downloads/mindforge-guard-hr-self-service-sample-pack-v0.1.zip "$RC_DIR/"
          cp downloads/mindforge-guard-hr-self-service-sample-pack-v0.1.zip.sha256 "$RC_DIR/"
          python3 -m zipfile -e downloads/mindforge-guard-hr-self-service-sample-pack-v0.1.zip "$RC_DIR/sample"
          GITHUB_SHA="4aa26fbdd418be669eb5c9cfeb1094b21ac554fb" GUARD_RC_OUTPUT_DIR="$RC_DIR" GUARD_RC_INSTALL_DIR="$PREFIX" GUARD_RC_TGZ="$TGZ" node scripts/verify_v7_1_rc_install.mjs
          echo "4aa26fbdd418be669eb5c9cfeb1094b21ac554fb" > "$RC_DIR/merge-candidate-sha.txt"
          echo "0d3b1d9d1a1677f4619bef370691c0c77ecb4c61" > "$RC_DIR/parent-main-sha.txt"
          echo "af0ca5427c90bb07d274d10c6df737ca5f89c782" > "$RC_DIR/parent-pr351-sha.txt"
