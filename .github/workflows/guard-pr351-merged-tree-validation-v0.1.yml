          if-no-files-found: warn
  integration-windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4aa26fbdd418be669eb5c9cfeb1094b21ac554fb
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PowerShell 5.1 regression, fixed merged tree and installed package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) { throw 'PS5_1_REQUIRED' }
          if ((git rev-parse HEAD).Trim() -ne '4aa26fbdd418be669eb5c9cfeb1094b21ac554fb') { throw 'SOURCE_SHA_MISMATCH' }
          if ((git rev-parse 'HEAD^1').Trim() -ne '0d3b1d9d1a1677f4619bef370691c0c77ecb4c61') { throw 'MAIN_PARENT_MISMATCH' }
          if ((git rev-parse 'HEAD^2').Trim() -ne 'af0ca5427c90bb07d274d10c6df737ca5f89c782') { throw 'PR_PARENT_MISMATCH' }
          if ((git rev-parse 'HEAD:experiments').Trim() -ne '1b77eebbd74af73fcc6a291ceaf2e6be99724702') { throw 'RESEARCH_TREE_MISMATCH' }
          npm.cmd ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'NPM_CI_FAILED' }
          foreach ($task in @('verify','verify:v7.0.1')) {
            npm.cmd run $task
            if ($LASTEXITCODE -ne 0) { throw ('REGRESSION_FAILED:' + $task) }
          }
          foreach ($script in @('verify_commercial_edition_boundary.mjs','verify_v7_role_based_report_render.mjs','verify_v7_1_rc_consistency.mjs')) {
            node.exe ('scripts/' + $script)
            if ($LASTEXITCODE -ne 0) { throw ('CHECK_FAILED:' + $script) }
          }
          python scripts/build_a2_sample_pack.py
          if ($LASTEXITCODE -ne 0) { throw 'SAMPLE_BUILD_FAILED' }
          python scripts/verify_a2_sample_pack.py
          if ($LASTEXITCODE -ne 0) { throw 'SAMPLE_VERIFY_FAILED' }
          git diff --exit-code -- downloads/ package-lock.json packages/guard/package.json
          if ($LASTEXITCODE -ne 0) { throw 'SOURCE_DIFF_DETECTED' }
          $rcDir = Join-Path $env:RUNNER_TEMP 'guard-merge-windows'
          $prefix = Join-Path $env:RUNNER_TEMP 'guard-install-windows'
          New-Item -ItemType Directory -Force $rcDir,$prefix,(Join-Path $rcDir 'sample') | Out-Null
          npm.cmd pack --workspace @veeduzyl/mindforge-guard --pack-destination $rcDir --json | Out-File -Encoding utf8 (Join-Path $rcDir 'npm-pack.json')
          if ($LASTEXITCODE -ne 0) { throw 'PACK_FAILED' }
          $tgz = Join-Path $rcDir 'veeduzyl-mindforge-guard-7.1.0-rc.0.tgz'
          npm.cmd install --prefix $prefix --ignore-scripts --no-audit --no-fund $tgz
          if ($LASTEXITCODE -ne 0) { throw 'INSTALL_FAILED' }
          Copy-Item downloads/mindforge-guard-hr-self-service-sample-pack-v0.1.zip $rcDir
          Copy-Item downloads/mindforge-guard-hr-self-service-sample-pack-v0.1.zip.sha256 $rcDir
          Expand-Archive -LiteralPath 'downloads/mindforge-guard-hr-self-service-sample-pack-v0.1.zip' -DestinationPath (Join-Path $rcDir 'sample')
          $env:GITHUB_SHA = '4aa26fbdd418be669eb5c9cfeb1094b21ac554fb'
          $env:GUARD_RC_OUTPUT_DIR = $rcDir
          $env:GUARD_RC_INSTALL_DIR = $prefix
          $env:GUARD_RC_TGZ = $tgz
          node.exe scripts/verify_v7_1_rc_install.mjs
          if ($LASTEXITCODE -ne 0) { throw 'VERIFIER_FAILED' }
          '4aa26fbdd418be669eb5c9cfeb1094b21ac554fb' | Set-Content -Encoding ascii (Join-Path $rcDir 'merge-candidate-sha.txt')
          '0d3b1d9d1a1677f4619bef370691c0c77ecb4c61' | Set-Content -Encoding ascii (Join-Path $rcDir 'parent-main-sha.txt')
          'af0ca5427c90bb07d274d10c6df737ca5f89c782' | Set-Content -Encoding ascii (Join-Path $rcDir 'parent-pr351-sha.txt')
          [System.Runtime.InteropServices.RuntimeInformation]::OSDescription | Set-Content -Encoding ascii (Join-Path $rcDir 'host-platform.txt')
          (node --version) | Set-Content -Encoding ascii (Join-Path $rcDir 'node-version.txt')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr351-merged-integration-windows
          path: ${{ runner.temp }}/guard-merge-windows/
          retention-days: 30
          if-no-files-found: warn
