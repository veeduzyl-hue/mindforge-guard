name: ARCH v0.2.x M3 Discover and Mapping Draft synthetic
on:
  push:
    branches:
      - experiment/arch-v02x-m3-discover-draft-synthetic-20261119
    paths:
      - scripts/arch_v02x_m3_discover_draft_synthetic.mjs
      - scripts/verify_arch_v02x_m3_discover_draft_synthetic.mjs
      - docs/engineering/ARCH_V02X_M3_DISCOVER_MAPPING_DRAFT_SYNTHETIC_v0.1.md
      - .github/workflows/arch-v02x-m3-discover-draft-synthetic-20261119.yml
  pull_request:
    branches:
      - experiment/arch-v02x-m3-inventory-synthetic-20261119
permissions:
  contents: read
jobs:
  linux-m3-discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 45
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify fixed source parent and exact changed paths
        shell: bash
        run: |
          set -euo pipefail
          parent=11337880c7e97a1d2a274009ed28c36279f302c7
          git merge-base --is-ancestor "$parent" HEAD
          actual="$(git diff --name-only "$parent" HEAD)"
          expected="$(printf '%s\n' '.github/workflows/arch-v02x-m3-discover-draft-synthetic-20261119.yml' \
            'docs/engineering/ARCH_V02X_M3_DISCOVER_MAPPING_DRAFT_SYNTHETIC_v0.1.md' \
            'scripts/arch_v02x_m3_discover_draft_synthetic.mjs' \
            'scripts/verify_arch_v02x_m3_discover_draft_synthetic.mjs')"
          test "$actual" = "$expected"
          git diff --check "$parent" HEAD
          node --check scripts/arch_v02x_m3_discover_draft_synthetic.mjs
          node --check scripts/verify_arch_v02x_m3_discover_draft_synthetic.mjs
          echo "ARCH_M3_FIXED_HEAD=$(git rev-parse HEAD)"
      - name: Legacy Guard, previous M3 Inventory and new Discover-Draft tests
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run verify:v7.0.1
          before="$(git status --porcelain=v1 --untracked-files=normal)"
          node scripts/verify_arch_v02x_m3_source_inventory_synthetic.mjs
          node scripts/verify_arch_v02x_m3_discover_draft_synthetic.mjs
          after="$(git status --porcelain=v1 --untracked-files=normal)"
          if [[ "$before" != "$after" ]]; then
            echo 'M3_TESTS_MUTATED_WORKTREE'; printf 'before=%q after=%q\n' "$before" "$after"; exit 88
          fi
          if [[ -n "$before" ]]; then
            bin='packages/guard/bin/guard.mjs'
            if [[ "$before" != " M $bin" ]] ||
              [[ "$(git ls-files --stage -- "$bin" | awk '{print $1}')" != '100644' ]] ||
              [[ "$(git hash-object "$bin")" != "$(git rev-parse "HEAD:$bin")" ]] ||
              [[ ! -x "$bin" ]]; then
                echo 'UNATTRIBUTED_LINUX_BASELINE_MUTATION'; exit 89
            fi
            echo 'LINUX_NPM_CI_EXECUTABLE_MODE_ONLY=BOUNDED_EXCEPTION'
          fi
          echo 'M3_DISCOVER_DRAFT=SYNTHETIC_ONLY'
          echo 'M4_62=NOT_RUN; M5_HUMAN=NOT_TESTED; SIGNING=DEFERRED'
  windows-x64-m3-discover:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 45
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          architecture: x64
      - name: Verify frozen identity and exact changed paths
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parent='11337880c7e97a1d2a274009ed28c36279f302c7'
          git merge-base --is-ancestor $parent HEAD
          if($LASTEXITCODE -ne 0){throw 'WRONG_FROZEN_PARENT'}
          $wanted=@(
            '.github/workflows/arch-v02x-m3-discover-draft-synthetic-20261119.yml',
            'docs/engineering/ARCH_V02X_M3_DISCOVER_MAPPING_DRAFT_SYNTHETIC_v0.1.md',
            'scripts/arch_v02x_m3_discover_draft_synthetic.mjs',
            'scripts/verify_arch_v02x_m3_discover_draft_synthetic.mjs'
          )
          $changed=@(git diff --name-only $parent HEAD)
          if($changed.Count -ne 4){throw 'SOURCE_CHANGED_PATH_COUNT_MISMATCH'}
          foreach($p in $changed){if($p -notin $wanted){throw ('UNAUTHORIZED_CHANGED_FILE:'+ $p)}}
          git diff --check $parent HEAD
          if($LASTEXITCODE -ne 0){throw 'DIFF_CHECK_FAILED'}
          node --check scripts/arch_v02x_m3_discover_draft_synthetic.mjs
          if($LASTEXITCODE -ne 0){throw 'DISCOVER_PARSE_FAILED'}
          node --check scripts/verify_arch_v02x_m3_discover_draft_synthetic.mjs
          if($LASTEXITCODE -ne 0){throw 'DISCOVER_TEST_PARSE_FAILED'}
          Write-Output ('ARCH_M3_FIXED_HEAD='+(git rev-parse HEAD).Trim())
      - name: Guard v7.0.1 and cross-platform M3 Inventory / Discover cases
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npm.cmd ci --ignore-scripts --no-audit --no-fund
          if($LASTEXITCODE -ne 0){throw 'NPM_CI_FAILED'}
          npm.cmd run verify:v7.0.1
          if($LASTEXITCODE -ne 0){throw 'V701_REGRESSION_FAILED'}
          $before=@(git status --porcelain=v1 --untracked-files=normal)
          node scripts/verify_arch_v02x_m3_source_inventory_synthetic.mjs
          if($LASTEXITCODE -ne 0){throw 'SOURCE_INVENTORY_REGRESSION_FAILED'}
          node scripts/verify_arch_v02x_m3_discover_draft_synthetic.mjs
          if($LASTEXITCODE -ne 0){throw 'M3_DISCOVER_SYNTHETIC_TEST_FAILED'}
          $after=@(git status --porcelain=v1 --untracked-files=normal)
          if(($before -join [char]10) -ne ($after -join [char]10)){throw 'M3_DISCOVER_MUTATED_WORKTREE'}
          if(@($after|Where-Object {$_ -ne ''}).Count -gt 0){throw 'WINDOWS_WORKTREE_NOT_CLEAN'}
          Write-Output 'M3_DISCOVER_DRAFT=SYNTHETIC_ONLY'
          Write-Output 'M4_62=NOT_RUN; M5_HUMAN=NOT_TESTED; SIGNING=DEFERRED'
