name: I1 Windows junction negative test for pinned candidate
on:
  push:
    branches:
      - validation/i1-windows-junction-20261111
    paths:
      - .github/workflows/i1-windows-junction-negative-v0.1.yml
permissions:
  contents: read
jobs:
  windows-junction:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2db5a7220c7cbbccb21094a74a6eb58fcb85b44c
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Create Windows junction and verify I1 rejects linked Pack
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne '2db5a7220c7cbbccb21094a74a6eb58fcb85b44c') { throw 'PINNED_SHA_MISMATCH' }
          $script = @'
          const fs=require('node:fs');
          const os=require('node:os');
          const path=require('node:path');
          const cp=require('node:child_process');
          const tmp=fs.mkdtempSync(path.join(os.tmpdir(),'guard-i1-win-junction-'));
          const target=path.resolve('examples/single-agent-governance-pack/hr-self-service-agent');
          const alias=path.join(tmp,'linked-pack');
          const dest=path.join(tmp,'result');
          const receipt={kind:'I1_WINDOWS_JUNCTION_NEGATIVE',platform:process.platform,arch:process.arch,tested_sha:'2db5a7220c7cbbccb21094a74a6eb58fcb85b44c',target:'synthetic-sample',status:'INCONCLUSIVE'};
          try {
            fs.symlinkSync(target,alias,'junction');
            const stat=fs.lstatSync(alias);
            receipt.junction_created=true;
            receipt.lstat_symbolic_link=stat.isSymbolicLink();
            const r=cp.spawnSync(process.execPath,['packages/guard/bin/guard.mjs','review','--pack',alias,'--out',dest],{cwd:process.cwd(),encoding:'utf8',timeout:90000});
            if(r.error) throw r.error;
            receipt.exit_code=r.status;
            receipt.no_final_output=!fs.existsSync(dest);
            receipt.stderr_kind=(r.stderr||'').includes('invalid_input')?'invalid_input':'other';
            if(r.status!==4||fs.existsSync(dest)||!stat.isSymbolicLink()) throw new Error('Expected fail-closed linked Pack, got exit '+r.status);
            receipt.status='PASS_REJECTED_JUNCTION';
          }catch(e){receipt.status=receipt.junction_created?'FAIL':'BLOCKED_JUNCTION_CREATE';receipt.error=e.message;process.exitCode=1;}
          finally {
            const out=path.join(process.env.RUNNER_TEMP,'i1-win-junction-receipt');
            fs.mkdirSync(out,{recursive:true});
            fs.writeFileSync(path.join(out,'receipt.json'),JSON.stringify(receipt,null,2)+'\n');
            fs.rmSync(tmp,{recursive:true,force:true});
            console.log('I1_WINDOWS_JUNCTION '+receipt.status);
          }
          '@
          $p = Join-Path $env:RUNNER_TEMP 'i1-windows-junction-negative.cjs'
          $script | Set-Content -LiteralPath $p -Encoding ascii
          node.exe $p
          if ($LASTEXITCODE -ne 0) { throw 'I1_WINDOWS_JUNCTION_NOT_PASSED' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i1-windows-junction-candidate-negative-receipt
          path: ${{ runner.temp }}/i1-win-junction-receipt/
          retention-days: 30
          if-no-files-found: warn
